<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Партнёры MP</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/site.css" />
  <style>
    :root { --ink:#0B1220; --muted:#475569; --line:#f1e4c8; }
    * { box-sizing: border-box; }
    body { margin:0; font: 15px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; color:var(--ink);
      background: linear-gradient(180deg, #fff4d6 0%, #fffaf3 28%, #f4f7ff 100%); min-height:100vh; }
    main { max-width: 960px; margin: 36px auto; padding: 0 20px 80px; }
    a { color:#1f60e0; }
    h1 { font-size:28px; letter-spacing:-.03em; margin:0 0 8px; }
    .lead, .hint { color:var(--muted); }
    section { background:#fff; border:1px solid var(--line); border-radius:20px; padding:20px 22px; margin-bottom:16px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:10px 6px; border-bottom:1px solid #f1e4c8; }
    th { color:var(--muted); font-weight:600; }
    button { background:var(--ink); color:#fff; border:0; border-radius:10px; padding:8px 14px; font:600 13px Inter, sans-serif; cursor:pointer; }
    button.ghost { background:#fff; color:var(--ink); border:1px solid #ead9b3; }
    input, textarea { font:inherit; padding:8px 10px; border:1px solid #ead9b3; border-radius:10px; background:#fffef9; width:100%; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:10px 0; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .err { color:#b91c1c; }
    .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:#f1e4c8; }
    .badge.on { background:#dcfce7; }
    .prog-sum { margin: 0 0 14px; font-size: 15px; }
    .prog-sum b { font-size: 22px; letter-spacing: -.03em; }
    .prog-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .prog { display: flex; gap: 3px; height: 12px; min-width: 88px; flex: 1; max-width: 220px; }
    .prog i { flex: 1; min-width: 6px; border-radius: 3px; background: #ead9b3; }
    .prog i.ok { background: #16a34a; }
    .prog i.miss { background: #dc2626; }
    .prog-n { font-size: 13px; font-weight: 600; white-space: nowrap; }
    .prog-n .left { color: #c2410c; }
    .prog-n .done { color: #166534; }
  </style>
</head>
<body>
<script src="/static/nav.js"></script>
<main>
  <h1>Партнёры</h1>
  <p class="lead">Зелёное — уже вышло, серое — ещё нет, красное — пропущено.</p>
  <div id="sum" class="prog-sum"></div>
  <section>
    <div class="row">
      <input id="q" type="search" placeholder="поиск" style="max-width:320px" />
      <button type="button" class="ghost" id="btn-search">Найти</button>
    </div>
    <div id="err" class="err"></div>
    <table>
      <thead><tr><th>Компания</th><th>Прогресс</th><th></th></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </section>
  <section>
    <h2>+ партнёр без кита</h2>
    <form id="add">
      <div class="grid">
        <div><label>Company</label><input name="company" required /></div>
        <div><label>Code</label><input name="code" required /></div>
        <div><label>Reg URL</label><input name="reg_url" /></div>
        <div><label>Ссылка на кит</label><input name="notion_page_url" /></div>
      </div>
      <p><label>Posting dates</label><textarea name="posting_dates_raw" rows="2"></textarea></p>
      <p><label>Заметки</label><textarea name="notes" rows="2"></textarea></p>
      <button type="submit">Создать</button>
      <div id="add-err" class="err"></div>
      <div id="add-conflict" class="hint"></div>
    </form>
  </section>
</main>
<script>
  function ticksBar(ticks) {
    ticks = ticks || [];
    if (!ticks.length) return '<span class="hint">нет выходов</span>';
    const done = ticks.filter((s) => s === "published").length;
    const left = ticks.length - done;
    const cells = ticks.map((s) => {
      const cls = s === "published" ? "ok" : s === "missed" ? "miss" : "";
      return `<i class="${cls}" title="${s}"></i>`;
    }).join("");
    const label = left === 0
      ? `<span class="done">${done}/${ticks.length} · всё вышло</span>`
      : `${done}/${ticks.length} · <span class="left">осталось ${left}</span>`;
    return `<span class="prog-line"><span class="prog">${cells}</span><span class="prog-n">${label}</span></span>`;
  }
  async function j(url, opts) {
    const res = await fetch(url, opts);
    const text = await res.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch { data = { detail: text }; }
    if (!res.ok && res.status !== 409) throw new Error(data.detail || res.statusText);
    data._status = res.status;
    return data;
  }
  async function load() {
    const q = document.getElementById("q").value.trim();
    const data = await j("/api/partners" + (q ? "?q=" + encodeURIComponent(q) : ""));
    const list = (data.partners || []).slice().sort((a, b) =>
      Number(b.confirmed) - Number(a.confirmed) || (b.left || 0) - (a.left || 0) || (a.company || "").localeCompare(b.company || "")
    );
    const live = list.filter(p => p.confirmed);
    const done = live.reduce((n, p) => n + (p.done || 0), 0);
    const total = live.reduce((n, p) => n + (p.pub_count || 0), 0);
    const left = Math.max(0, total - done);
    document.getElementById("sum").innerHTML = total
      ? `Вышло <b>${done}</b> · осталось <b>${left}</b> · всего <b>${total}</b>`
      : "";
    document.getElementById("body").innerHTML = list.map(p => `
      <tr class="score-row">
        <td>
          <a href="/partners/${p.id}">${p.company}</a>
          ${p.confirmed ? "" : ' <span class="badge">черновик</span>'}
          <div class="hint">${p.code || ""}</div>
        </td>
        <td>${ticksBar(p.ticks)}</td>
        <td><a href="/materials?p=${p.id}">Редактировать</a>${(p.kit_missing||[]).length ? `<div class="hint">нет ${p.kit_missing.join(", ")}</div>` : ""}</td>
      </tr>`).join("") || `<tr><td colspan="3">пусто</td></tr>`;
  }
  document.getElementById("btn-search").onclick = () => load().catch(e => document.getElementById("err").textContent = e.message);
  document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("btn-search").click(); });
  document.getElementById("add").onsubmit = async (e) => {
    e.preventDefault();
    const err = document.getElementById("add-err");
    const box = document.getElementById("add-conflict");
    err.textContent = ""; box.innerHTML = "";
    const body = Object.fromEntries(new FormData(e.target).entries());
    const data = await j("/api/partners", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
    if (data._status === 409) {
      const ex = data.existing;
      box.innerHTML = `Уже есть <a href="/partners/${ex.id}">${ex.company}</a> (${ex.code || "без кода"}). <button type="button" id="upd">Обновить существующего</button>`;
      document.getElementById("upd").onclick = async () => {
        body.update = true;
        const saved = await j("/api/partners", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) });
        location.href = "/partners/" + (saved.partner || ex).id;
      };
      return;
    }
    location.href = "/partners/" + data.partner.id;
  };
  load().catch(e => document.getElementById("err").textContent = e.message);
</script>
</body>
</html>
